# gitleaks config for the auditjobme CI secrets-scan.
# Extends the default ruleset, then allowlists the ONE by-design exception:
# the committed .env holds only the Supabase publishable/anon key (role=anon),
# which is public by design — RLS is the security model (v1 spec §2). The
# git-history audit (tools/plan2-exposure-audit.sh in the planning repo)
# confirmed no service-role key has ever been committed.
title = "auditjobme gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public-by-design values: Supabase anon keys (RLS-gated) in .env and in the scraper, plus Teamtailor's auto-suffixed public career-site subdomains."
paths = [
  '''^\.env$''',
]
regexes = [
  # Teamtailor gives a career site whose preferred name is taken a subdomain with
  # a creation-timestamp suffix (evrocab-1692891239 -> the public feed at
  # https://evrocab-1692891239.teamtailor.com/jobs.json). Sitting next to a
  # "token" key in scripts/boards.json, that reads as high entropy to the generic
  # rule. It is a hostname anyone can fetch, not a credential. Deliberately narrow:
  # only the "-1XXXXXXXXX" epoch shape, so a real key next to "token" still fails CI.
  '''^[a-z0-9][a-z0-9-]*-1[0-9]{9}$''',
  # Scaling Europe (scalingeurope.co.uk) job-board's Supabase publishable/anon
  # key — project yaionvwehtkrqgtjzdqn, role=anon, exp 2036. Public by design
  # (shipped in that site's own browser bundle), used read-only to call their
  # public /rest/v1/jobs board. NOT our project and NOT a secret; decoded +
  # documented at scripts/sources/vc-startupmap.mjs:42-48. gitleaks' generic
  # `jwt` rule can't see role=anon inside the token, so allowlist it explicitly.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaW9udndlaHRrcnFndGp6ZHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MTE4MjAsImV4cCI6MjA4OTA4NzgyMH0\.1FahdfqyoL9k0OEMk8Z2ig3Hkhc78GpORax0uRoKvOY''',
]
