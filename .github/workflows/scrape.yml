name: Scrape jobs

# The run's own name says who asked for it. The scrape watchdog restarts this
# workflow at most once a day, and it proves it has stayed inside that bound by
# reading the run list. Until 2026-08-28 it read the newest workflow_dispatch run
# of any kind, so a run Rober started by hand spent the watchdog's daily budget:
# on that morning the pool was 15.6 hours stale and the restart was skipped
# because of a manual run 20.8 hours earlier. A marked run-name separates the two.
# Read by api/scrape-watchdog.ts through isWatchdogRestart (src/lib/scrapeWatchdog.ts).
run-name: ${{ inputs.reason == 'watchdog' && 'Scrape jobs (watchdog restart)' || 'Scrape jobs' }}

# Daily refresh of the shared `jobs` pool (scripts/scrape.mjs).
#
# ACTIVATION (one-time, by Rober): add two repo secrets under
# Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL               = https://roaervdsjejksaeseeov.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  = Supabase dashboard -> Project Settings -> API -> service_role key
# Until both exist, scrape.mjs dry-runs (fetch + log, no DB write), so this workflow is safe to land now.
# OPTIONAL: ANTHROPIC_API_KEY enables the Haiku JD-grounded pass in the enrich step below;
# without it, enrichment still runs on free web (og:description) + Wikidata sources.

on:
  schedule:
    # 05:00 UTC, ONE HOUR BEFORE the nightly scorer (nightly.yml repeat trigger:
    # /api/nightly, kicks off at 06:00) — both used to fire at 06:00, so scoring
    # raced the scrape and could read yesterday's pool (Track D S6). Scrape+extract+
    # enrich finish well inside the hour; if this ever slips past 06:00 the scorer
    # just sees yesterday's jobs once, it never breaks.
    - cron: "0 5 * * *"
  workflow_dispatch:
    # Manual trigger from the Actions tab. Leave `reason` alone when you start a
    # run yourself: only the watchdog sends 'watchdog', and only that value marks
    # the run as one of its own once-a-day restarts.
    #
    # TESTING THE MARKER COSTS THE REAL BUDGET. A run dispatched by hand with
    # reason=watchdog is indistinguishable from the watchdog's own, so it spends
    # tomorrow's restart: the 08:00 UTC check reads it, sees a restart inside the
    # 24-hour window, and holds off during a genuine outage. That happened while
    # verifying this on 2026-08-28. Cancel AND delete the run afterwards
    # (`gh api -X DELETE repos/<repo>/actions/runs/<id>`, only once it has
    # finished cancelling), or the verification recreates the bug it proved fixed.
    inputs:
      reason:
        description: "Who asked for this run"
        required: false
        default: manual
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Scrape into the jobs pool
        run: node scripts/scrape.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: residential/rotating proxy for the datacenter-IP-blocked sources
          # (startupmap, Meta). Unset = those two fetch direct (and get blocked from CI).
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
      # Issue #143 (follow-up to #130): a role with no readable jd_text is never
      # scored, so every blank row this fills is a role that can rank tomorrow.
      # Runs AFTER ingestion, BEFORE extraction, so a filled body is extracted in
      # the same run and scored on the next backlog tick. Bounded: 300 rows per
      # run, newest first (the cap is BACKFILL_LIMIT in scripts/jd-backfill-lib.mjs).
      - name: Backfill missing JD bodies via ATS detail APIs (LLM-free, 300 rows/run)
        continue-on-error: true # additive; a hiccup must never fail the core scrape
        run: node scripts/jd-backfill.mjs --limit 300
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Extract structured facts from jd_text (jobs.extraction)
        continue-on-error: true # additive; fail-open, never blocks the chain
        run: node scripts/extract-jd.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: enables the Haiku judgment fields. Unset = heuristic-only (YoE + salary via regex).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Enrich company context (description, founded_year, sector/stage gaps)
        run: node scripts/enrich-companies.mjs --limit=150
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: enables the Haiku JD-grounded pass. Unset = free og:description + Wikidata only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Company size carries ~95% of the deterministic ranker's power (issue #68
      # item 6), so filling it is economics work, not cosmetics. startupmap.one's
      # company directory is the one source we already hold that states a size.
      - name: Backfill missing company size buckets from startupmap.one
        continue-on-error: true # additive; a third-party hiccup must never fail the scrape
        run: node scripts/backfill-headcount.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # startupmap 403s datacenter IPs; same proxy the scrape step uses.
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
      - name: Match companies to the UK Skilled-Worker sponsor register (companies.uk_sponsor_status)
        continue-on-error: true # additive; a gov.uk hiccup must never fail the core scrape
        run: node scripts/enrich-uk-sponsors.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Issue #68 items 1+5: the ONLY retirement path for rows from vc:*, startupmap,
      # workday, factorial, bigtech and seed sources (the board-diff above never
      # re-scans them). Conservative verdicts: 404/410 + slug-dropping redirects
      # retire; 403/5xx/timeout are left alone. Oldest-checked-first rotation.
      - name: Liveness sweep over immortal-class rows (retire dead URLs)
        continue-on-error: true # hygiene; a hiccup must never fail the core scrape
        run: node scripts/liveness-sweep.mjs --apply --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Issue #153 item B1: a `companies` row for every distinct company on live
      # jobs that lacks one (~40% of them — no row means no logo, no coordinates,
      # no sector). Runs BEFORE the logo backfill so the rows it creates are
      # eligible for a logo domain in the SAME run.
      - name: Create company records for job-derived companies
        continue-on-error: true # additive; a hiccup must never fail the core scrape
        run: node scripts/company-records.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Issue #68 item 4: derive companies.logo_domain from the company's own
      # careers/website URL for null-logo companies with a live role. Hosted-ATS
      # URLs never produce a domain (a wrong domain renders a wrong logo). Issue
      # #153 item B1 extended this: a company with NEITHER a careers_url NOR a
      # website (the job-derived rows just above) falls to its own apply-URL host.
      - name: Backfill missing company logo domains (careers/website URL derivation)
        continue-on-error: true # cosmetic; must never fail the core scrape
        run: node scripts/logo-backfill.mjs --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Issue #153 item B2: real street coordinates per company x city, via
      # Nominatim (Mapbox instead when MAPBOX_TOKEN/MAPBOX_ACCESS_TOKEN is set —
      # neither exists in this repo's secrets today, checked read-only for the
      # issue). Cached forever in geocode_cache (migration 20260827110000);
      # degrades gracefully (skips caching only) if that migration is not applied
      # yet. Companies without a resolved office keep the client's centroid disc.
      - name: Geocode company offices
        continue-on-error: true # third-party rate limit; a hiccup must never fail the core scrape
        run: node scripts/geocode-companies.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: prefer Mapbox over Nominatim when a key exists (either name).
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      # F3 (issue #37): publish the static dataplane LAST, after every write to the
      # pool — the /roles map and the GEO feeds fetch these artifacts instead of
      # querying the DB per visitor. Deliberately NOT continue-on-error: a red run
      # here means the map is serving yesterday's artifact (visible, not fatal —
      # the app falls back to live reads if the artifact is missing entirely).
      - name: Publish the static dataplane (jobs + companies + offices → Storage)
        run: node scripts/build-dataplane.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
