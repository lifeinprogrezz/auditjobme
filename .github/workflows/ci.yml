name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # AI calls are mocked in tests — no live Anthropic key in CI (spec §6).
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Smoke E2E (public surface) is intentionally NOT a CI step. It needs a ~167 MB
      # Playwright/Chromium download every push (no browser cache), which blew a 5-min
      # budget and added no signal the blocking steps above don't already give. The same
      # checks run locally on demand via the /verify skill (scripts/verify-smoke.mjs).
      # To bring it back to CI, first add actions/cache on ~/.cache/ms-playwright so the
      # browser download is paid once, not per push.

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
