name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # AI calls are mocked in tests — no live Anthropic key in CI (spec §6).
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Smoke E2E (public surface) is intentionally NOT a CI step. It needs a ~167 MB
      # Playwright/Chromium download every push (no browser cache), which blew a 5-min
      # budget and added no signal the blocking steps above don't already give. The same
      # checks run locally on demand via the /verify skill (scripts/verify-smoke.mjs).
      # To bring it back to CI, first add actions/cache on ~/.cache/ms-playwright so the
      # browser download is paid once, not per push.

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations-rls:
    name: migrations + RLS check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      # Boots the full local Supabase stack (Postgres + Auth + Storage, via Docker) on a
      # totally fresh checkout and applies every file in supabase/migrations/ to it, in
      # order -- this IS the "apply all migrations to an ephemeral DB" step (F10, issue
      # #40). A plain postgres service container isn't enough: several migrations
      # reference auth.uid()/auth.users and storage.objects/storage.buckets, which only
      # exist in the real Supabase stack, not vanilla Postgres.
      - name: Start local Supabase stack (applies all migrations)
        run: supabase start

      - name: Assert RLS is enabled + policies exist on every public table
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/assert_rls.sql

      # Issue #132: the schema these migrations build must equal the committed
      # snapshot of PRODUCTION's schema (supabase/schema-snapshot.json). A '+'
      # line means production has an object no migration describes; a '-' line
      # means a migration was never applied there. Either way the RLS check
      # above was asserting against a schema that is not the live one.
      - name: Schema drift — migrations vs production snapshot
        run: |
          eval "$(supabase status -o env)"
          DATABASE_URL="$DB_URL" node scripts/schema-drift-check.mjs

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  schema-drift-prod:
    # The other half of #132: production itself vs the committed snapshot, read
    # through public.schema_snapshot() with the service role. Catches an object
    # applied through the dashboard or MCP that nobody mirrored into the repo.
    # Secrets are absent on pull requests from forks, so the step skips there.
    # Runs on pushes to main ONLY: a pull request that ADDS a migration cannot
    # match production until that migration is applied, which by policy happens
    # at merge time. On a PR this job is red by construction, not by drift.
    name: schema drift (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare production schema with supabase/schema-snapshot.json
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/schema-drift-check.mjs
